<div id="app"></div>

<!--
  A ORDEM IMPORTA: cada arquivo usa o que foi carregado antes dele.
  1. config      → horários e datas disponíveis
  2. api         → comunicação com Django
  3. utils       → funções de formatação e cálculo
  4. state       → estado da tela
  5. componentes → pedaços de HTML reutilizáveis
  6. views/*     → uma tela por arquivo
  7. views/app   → layout com menu + render()
  8. acoes       → ações conectadas ao backend
  9. listeners   → cliques, digitação e selects
 10. main        → restaura sessão e carrega dados da API
-->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/componentes.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/portal.js"></script>

<script src="js/views/detalhe.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/app.js"></script>
<script src="js/acoes.js"></script>
<script src="js/listeners.js"></script>
<script src="js/main.js"></script>
</body>
</html>
